<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>קהילה היא מארג של קשרים</title>
  <style>
    :root {
      --circle-size: 150px;
      --overlap: 40px;
      --row-overlap: 40px;
      --border-color: #111;
      --page-padding: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: var(--page-padding);
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      direction: rtl;
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }

    #circlesContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, calc(var(--circle-size) - var(--overlap)));
      grid-auto-rows: calc(var(--circle-size) - var(--row-overlap));
      justify-items: center;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      justify-content: center;
      column-gap: 0;
      row-gap: 0;
    }

    .circle {
      --ring-inset: 7px;
      --circle-fill: rgba(55, 145, 205, 0.5);

      width: var(--circle-size);
      height: var(--circle-size);
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      margin: 0;
      position: relative;
      isolation: isolate;
      transform-style: preserve-3d;
      transform: perspective(700px) rotateX(7deg) rotateZ(-9deg);
      filter: drop-shadow(5px 8px 5px rgba(0, 0, 0, 0.18));
      z-index: 1;
    }

    .circle::before {
      content: "";
      position: absolute;
      inset: var(--ring-inset);
      border-radius: 50%;
      background: url("tilted_3d_ring.svg") center / 150% 150% no-repeat,
        var(--circle-fill);
      pointer-events: none;
      z-index: -1;
    }

    /* Alternate the top layer where neighboring rings overlap. */
    .circle:nth-child(odd) {
      z-index: 3;
    }

    .circle:nth-child(even) {
      --circle-fill: rgba(226, 145, 52, 0.5);
      z-index: 2;
      transform: perspective(700px) rotateX(7deg) rotateZ(9deg);
    }

    .circle-title {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      font: inherit;
      font-size: 10px;
      line-height: 1.35;
      cursor: pointer;
      color: #111;
      text-align: center;
      max-width: 90px;
      overflow-wrap: anywhere;
      position: relative;
      z-index: 2;
      transform: rotateZ(4deg);
    }

    .circle-title:hover,
    .circle-title:focus-visible {
      text-decoration: underline;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(420px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
      position: relative;
      text-align: right;
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .modal p {
      margin: 0 0 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .modal a {
      display: inline-block;
      margin-top: 6px;
    }

    .close-button {
      position: absolute;
      top: 8px;
      left: 10px;
      border: 0;
      background: transparent;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    /* Keep at least two circles per row on narrow screens. */
    @media (max-width: 420px) {
      :root {
        --circle-size: 132px;
        --overlap: 36px;
      }

      body {
        padding-left: 8px;
        padding-right: 8px;
      }

      #circlesContainer {
        grid-template-columns: repeat(2, calc(var(--circle-size) - var(--overlap)));
        justify-content: center;
      }

      .circle {
        padding: 22px;
      }

      .circle-title {
        max-width: 82px;
      }
    }
  </style>
</head>
<body>
  <h1>קהילה היא מארג של קשרים (הקלק על קבוצת הווטסאפ לקבלת פרטים וקישור)</h1>

  <main id="circlesContainer" aria-label="מעגלי הקהילה"></main>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="close-button" type="button" aria-label="סגירה">×</button>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer">פתיחת קישור</a>
    </section>
  </div>

  <script src="community-circles.js"></script>
</body>
</html>
